name: Protect Main Branch

# Trigger on push events to main
on:
  push:
    branches:
      - main

jobs:
  block-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check if push is from a PR
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Direct push to main is not allowed! Please use a Pull Request."
            exit 1
          else
            echo "Push comes from a PR — allowed."
          fi
